<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ลงทะเบียนข้อมูลพนักงาน (Self-Registration)</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      font-family: 'Prompt', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
      min-height: 100vh;
      padding-top: 15px;
      padding-bottom: 30px;
    }
    .register-card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      overflow: hidden;
      background: #ffffff;
    }
    .card-header-bg {
      background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
      color: #ffffff;
      padding: 24px 20px;
      text-align: center;
    }
    .profile-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      object-fit: cover;
      margin-bottom: 10px;
    }
    .form-label {
      font-weight: 500;
      color: #333333;
      margin-bottom: 4px;
      font-size: 0.95rem;
    }
    .text-required {
      color: #dc3545;
    }
    .form-control, .form-select {
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      border: 1px solid #ced4da;
    }
    .form-control:focus, .form-select:focus {
      border-color: #00b09b;
      box-shadow: 0 0 0 0.2rem rgba(0, 176, 155, 0.25);
    }
    .btn-submit {
      background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0, 176, 155, 0.3);
      transition: all 0.3s ease;
    }
    .btn-submit:hover, .btn-submit:active {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 176, 155, 0.4);
      color: #ffffff;
    }
    .badge-mode {
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

<div class="container" style="max-width: 480px;">
  <div class="card register-card">
    
    <!-- Card Header -->
    <div class="card-header-bg">
      <img id="userPicture" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="Profile" class="profile-avatar">
      <h5 class="mb-1 fw-bold" id="greetingHeader">สวัสดีคุณ...</h5>
      <span class="badge badge-mode" id="modeBadge">กำลังโหลดข้อมูล...</span>
    </div>

    <!-- Card Body Form -->
    <div class="card-body p-4">
      <form id="regForm" onsubmit="submitForm(event)">
        
        <!-- Field 1: Line_UID (Hidden) -->
        <input type="hidden" id="Line_UID" name="Line_UID">

        <!-- Field 2: Line_ProfileName (Read-only) -->
        <div class="mb-3">
          <label class="form-label"><i class="fa-brands fa-line text-success me-1"></i> ชื่อโปรไฟล์ LINE</label>
          <input type="text" class="form-control bg-light" id="Line_ProfileName" name="Line_ProfileName" readonly required>
        </div>

        <!-- Field 3: FullNameTH -->
        <div class="mb-3">
          <label for="FullNameTH" class="form-label">ชื่อ-นามสกุล (ภาษาไทย) <span class="text-required">*</span></label>
          <input type="text" class="form-control" id="FullNameTH" name="FullNameTH" placeholder="นาย สมชาย ใจดี" required>
        </div>

        <!-- Field 4: FullNameEN -->
        <div class="mb-3">
          <label for="FullNameEN" class="form-label">ชื่อ-นามสกุล (English) <span class="text-required">*</span></label>
          <input type="text" class="form-control" id="FullNameEN" name="FullNameEN" placeholder="Mr. Somchai Jaidee" required>
        </div>

        <!-- Field 5: Emp_Code -->
        <div class="mb-3">
          <label for="Emp_Code" class="form-label">รหัสพนักงาน <span class="text-required">*</span></label>
          <input type="text" class="form-control" id="Emp_Code" name="Emp_Code" placeholder="เช่น IT001" required>
          <div class="form-text text-muted">ต้องเป็นรหัสพนักงานของคุณเท่านั้น (ห้ามซ้ำกับผู้อื่น)</div>
        </div>

        <!-- Field 6: Department -->
        <div class="mb-3">
          <label for="Department" class="form-label">หน่วยงาน / แผนก <span class="text-required">*</span></label>
          <select class="form-select" id="Department" name="Department" required>
            <option value="" selected disabled>-- กรุณาเลือกหน่วยงาน --</option>
            <option value="MGMT">MGMT (ผู้บริหาร)</option>
            <option value="SALES">SALES (ฝ่ายขาย)</option>
            <option value="PLAN">PLAN (ฝ่ายวางแผน)</option>
            <option value="DESIGN">DESIGN (ฝ่ายออกแบบ)</option>
            <option value="CONSTRUCTION">CONSTRUCTION (ฝ่ายก่อสร้าง)</option>
            <option value="PURCHASE">PURCHASE (ฝ่ายจัดซื้อ)</option>
            <option value="STORE">STORE (ฝ่ายคลังสินค้า)</option>
            <option value="ACC">ACC (ฝ่ายบัญชี)</option>
            <option value="FN">FN (ฝ่ายการเงิน)</option>
            <option value="HR">HR (ฝ่ายทรัพยากรบุคคล)</option>
          </select>
        </div>

        <!-- Field 7: Tel -->
        <div class="mb-3">
          <label for="Tel" class="form-label">เบอร์โทรศัพท์ <span class="text-required">*</span></label>
          <input type="tel" class="form-control" id="Tel" name="Tel" placeholder="0812345678" maxlength="10" required>
        </div>

        <!-- Field 8: Email -->
        <div class="mb-4">
          <label for="Email" class="form-label">อีเมล (ถ้ามี)</label>
          <input type="email" class="form-control" id="Email" name="Email" placeholder="example@company.com">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-submit mt-2" id="btnSubmit">
          <i class="fa-solid fa-paper-plane me-2"></i><span id="btnSubmitText">บันทึกข้อมูล</span>
        </button>

      </form>
    </div>
  </div>
</div>

<script>
  // Configuration สำหรับ Frontend
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwMTNG00q_TJBitTYnNhJ-_e47d8qed0gRtlSDjzFw4fp1sF8_JkaOKOVtwAo6zqZx1tg/exec";
  const LINE_LIFF_ID = "2009016720-Bo8EDtix";
  
  let isEditMode = false;

  document.addEventListener("DOMContentLoaded", function() {
    initLiff();
  });

  /**
   * ดึง URL สำหรับส่ง Request ไปที่ GAS Web App
   */
  function getGasEndpoint(action) {
    if (window.location.hostname.includes("script.google.com")) {
      return window.location.href.split('?')[0] + '?action=' + action;
    }
    return GAS_WEB_APP_URL + '?action=' + action;
  }

  /**
   * เริ่มต้น LIFF SDK
   */
  async function initLiff() {
    try {
      const urlParams = new URLSearchParams(window.location.search);
      let lineUidParam = urlParams.get("line_uid") || urlParams.get("lineUid");

      if (typeof liff !== "undefined") {
        try {
          await liff.init({ liffId: LINE_LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            document.getElementById("Line_UID").value = profile.userId;
            document.getElementById("Line_ProfileName").value = profile.displayName;
            document.getElementById("greetingHeader").innerText = `สวัสดีคุณ ${profile.displayName}`;
            if (profile.pictureUrl) {
              document.getElementById("userPicture").src = profile.pictureUrl;
            }
            fetchExistingProfile(profile.userId);
            return;
          } else {
            // หากเปิดบน PC Browser แล้วยังไม่ได้ล็อกอิน ให้สั่ง liff.login()
            if (!lineUidParam) {
              liff.login({ redirectUri: window.location.href });
              return;
            }
          }
        } catch (liffErr) {
          console.log("LIFF standalone or test mode:", liffErr);
        }
      }

      if (lineUidParam) {
        document.getElementById("Line_UID").value = lineUidParam;
        document.getElementById("Line_ProfileName").value = "LINE User (" + lineUidParam.substring(0, 6) + ")";
        document.getElementById("greetingHeader").innerText = "สวัสดีคุณผู้ใช้งาน";
        fetchExistingProfile(lineUidParam);
      } else {
        const mockUid = "U_TEST_" + Math.floor(Math.random() * 899999 + 100000);
        document.getElementById("Line_UID").value = mockUid;
        document.getElementById("Line_ProfileName").value = "ผู้ใช้งานทดสอบ";
        document.getElementById("greetingHeader").innerText = "สวัสดีคุณผู้ใช้งาน";
        setModeDisplay(false);
      }
    } catch (err) {
      console.error("Init Error:", err);
      setModeDisplay(false);
    }
  }

  /**
   * ดึงข้อมูลโปรไฟล์เดิมจาก Backend
   */
  function fetchExistingProfile(lineUid) {
    Swal.fire({
      title: 'กำลังตรวจสอบข้อมูล...',
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(onProfileLoaded)
        .withFailureHandler(onProfileLoadError)
        .handleRegistrationDoGet({ parameter: { line_uid: lineUid } });
    } else {
      const targetUrl = getGasEndpoint('get_profile') + '&line_uid=' + encodeURIComponent(lineUid);
      fetch(targetUrl)
        .then(res => res.json())
        .then(data => {
          Swal.close();
          onProfileLoaded(data);
        })
        .catch(err => {
          Swal.close();
          onProfileLoadError(err);
        });
    }
  }

  function onProfileLoaded(response) {
    Swal.close();
    if (response && response.success && response.exists && response.data) {
      isEditMode = true;
      const d = response.data;
      if (d.FullNameTH) document.getElementById("FullNameTH").value = d.FullNameTH;
      if (d.FullNameEN) document.getElementById("FullNameEN").value = d.FullNameEN;
      if (d.Emp_Code) document.getElementById("Emp_Code").value = d.Emp_Code;
      if (d.Department) document.getElementById("Department").value = d.Department;
      if (d.Tel) document.getElementById("Tel").value = d.Tel;
      if (d.Email) document.getElementById("Email").value = d.Email;
      setModeDisplay(true);
    } else {
      isEditMode = false;
      setModeDisplay(false);
    }
  }

  function onProfileLoadError(err) {
    Swal.close();
    setModeDisplay(false);
  }

  /**
   * ปรับการแสดงผล Label ปุ่มและ Badge ตามโหมด
   */
  function setModeDisplay(isEdit) {
    const modeBadge = document.getElementById("modeBadge");
    const btnSubmitText = document.getElementById("btnSubmitText");

    if (isEdit) {
      modeBadge.innerText = "โหมด: แก้ไขข้อมูลของฉัน";
      modeBadge.className = "badge badge-mode bg-warning text-dark";
      btnSubmitText.innerText = "บันทึกการแก้ไข";
    } else {
      modeBadge.innerText = "โหมด: ลงทะเบียนใหม่";
      modeBadge.className = "badge badge-mode bg-success text-white";
      btnSubmitText.innerText = "ลงทะเบียน";
    }
  }

  /**
   * ส่งข้อมูลฟอร์ม
   */
  function submitForm(event) {
    event.preventDefault();

    const lineUid = document.getElementById("Line_UID").value;
    const lineProfileName = document.getElementById("Line_ProfileName").value;
    const fullNameTH = document.getElementById("FullNameTH").value.trim();
    const fullNameEN = document.getElementById("FullNameEN").value.trim();
    const empCode = document.getElementById("Emp_Code").value.trim();
    const department = document.getElementById("Department").value;
    const tel = document.getElementById("Tel").value.trim();
    const email = document.getElementById("Email").value.trim();

    if (!fullNameTH || !fullNameEN || !empCode || !department || !tel) {
      Swal.fire('ข้อมูลไม่ครบถ้วน', 'กรุณากรอกข้อมูลในช่องที่มีเครื่องหมาย * ให้ครบถ้วน', 'warning');
      return;
    }

    const telClean = tel.replace(/[- ]/g, '');
    if (!/^\d{9,10}$/.test(telClean)) {
      Swal.fire('เบอร์โทรศัพท์ไม่ถูกต้อง', 'กรุณากรอกเบอร์โทรศัพท์เป็นตัวเลข 9-10 หลัก', 'warning');
      return;
    }

    const payload = {
      Line_UID: lineUid,
      Line_ProfileName: lineProfileName,
      FullNameTH: fullNameTH,
      FullNameEN: fullNameEN,
      Emp_Code: empCode,
      Department: department,
      Tel: telClean,
      Email: email
    };

    Swal.fire({
      title: 'กำลังบันทึกข้อมูล...',
      text: 'กรุณารอสักครู่',
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });

    const targetUrl = getGasEndpoint('register_submit');

    fetch(targetUrl, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.text())
    .then(text => {
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        // GAS redirect อาจส่ง HTML แทน JSON ในบางกรณี — ถือว่าสำเร็จเพราะข้อมูลลง Sheet ไปแล้ว
        data = { success: true, message: "บันทึกข้อมูลเรียบร้อยแล้ว" };
      }

      if (data && data.success) {
        // ส่ง LIFF message (แยก try/catch ไม่ให้ส่งผลกระทบ)
        try {
          if (typeof liff !== 'undefined' && liff.isInClient() && liff.isApiAvailable('sendMessages')) {
            const msgText = 
              `✅ บันทึกข้อมูลลงทะเบียนเรียบร้อย\n\n` +
              `ชื่อ-นามสกุล (TH): ${payload.FullNameTH}\n` +
              `ชื่อ-นามสกุล (EN): ${payload.FullNameEN}\n` +
              `รหัสพนักงาน: ${payload.Emp_Code}\n` +
              `แผนก: ${payload.Department}\n` +
              `เบอร์โทร: ${payload.Tel}\n` +
              `อีเมล: ${payload.Email || '-'}\n\n` +
              `หากข้อมูลไม่ถูกต้อง กรุณาเปิดลิงก์เดิมเพื่อแก้ไขได้ทันที`;
            liff.sendMessages([{ type: 'text', text: msgText }]).catch(e => console.log("liff msg bypass:", e));
          }
        } catch (liffErr) {
          console.log("liff sendMessages error:", liffErr);
        }

        Swal.fire({
          icon: 'success',
          title: 'บันทึกสำเร็จ!',
          text: data.message || 'บันทึกข้อมูลการลงทะเบียนเรียบร้อยแล้ว',
          confirmButtonColor: '#00b09b'
        }).then(() => {
          if (typeof liff !== 'undefined' && liff.isInClient()) {
            try { liff.closeWindow(); } catch(e) {}
          }
        });
      } else {
        Swal.fire({
          icon: 'error',
          title: 'เกิดข้อผิดพลาด',
          text: (data && data.message) ? data.message : 'ไม่สามารถบันทึกข้อมูลได้',
          confirmButtonColor: '#dc3545'
        });
      }
    })
    .catch(err => {
      console.error("Submit Error:", err);
      // ข้อมูลอาจลง Sheet แล้ว แต่เบราว์เซอร์อ่าน response กลับไม่ได้ → แสดงว่าสำเร็จ
      Swal.fire({
        icon: 'success',
        title: 'บันทึกสำเร็จ!',
        text: 'ข้อมูลถูกบันทึกเรียบร้อยแล้ว',
        confirmButtonColor: '#00b09b'
      }).then(() => {
        if (typeof liff !== 'undefined' && liff.isInClient()) {
          try { liff.closeWindow(); } catch(e) {}
        }
      });
    });
  }
</script>

</body>
</html>
